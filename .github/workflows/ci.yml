name: ci

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:
    inputs:
      refresh_goldens:
        description: 'Rebuild the linux golden snapshots and upload them as an artifact'
        type: boolean
        default: false

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [18, 20]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - run: npm ci

      # The browser download is the slowest step by far, so it is keyed on the
      # playwright version in the lockfile and reused until that version moves.
      - name: Resolve the playwright version
        id: pw
        run: echo "version=$(node -p "require('playwright/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Cache the chromium download
        id: browser-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}

      - name: Install chromium
        run: npx playwright install --with-deps chromium

      # One command, the same one a contributor runs locally: typecheck, build, then the
      # unit, end to end, golden, and fidelity suites.
      - run: npm run verify
        if: ${{ !inputs.refresh_goldens }}

      - name: Build for the golden refresh
        if: ${{ inputs.refresh_goldens }}
        run: npm run build

      # Golden snapshots carry text geometry, so each platform needs its own set and
      # linux ones can only be made on linux. Dispatch this workflow with
      # refresh_goldens to rebuild them, then download the artifact and commit it.
      - name: Rebuild the linux goldens
        if: ${{ inputs.refresh_goldens && matrix.node == 20 }}
        run: npx tsx test/golden.ts --update

      - name: Upload the rebuilt goldens
        if: ${{ inputs.refresh_goldens && matrix.node == 20 }}
        uses: actions/upload-artifact@v4
        with:
          name: golden-linux
          path: test/golden/linux

      # A pixel failure is unreadable without the images, and a golden failure is
      # much faster to read as a file than as a diff in the log.
      - name: Upload the run outputs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-output-node${{ matrix.node }}
          path: |
            test/.out
            test/.fidelity
            test/.golden-work
          if-no-files-found: ignore
          retention-days: 7
